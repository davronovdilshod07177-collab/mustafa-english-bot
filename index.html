<!doctype html>
<html lang="en" data-theme="dark">

<meta charset="utf-8">

<title>Mustafa English · Prototype</title>
<style>
:root{--bg:#080D18;--surface:#111A2B;--border:#26344B;--text:#F5F8FF;--muted:#8E9BB5;--accent:#4A8DFF;--mint:#42D9B0;--gold:#F3B95E;--shadow:0 8px 24px rgba(0,0,0,.35);color-scheme:dark}
:root[data-theme="light"]{--bg:#F6F8FC;--surface:#FFFFFF;--border:#E5EBF3;--text:#132036;--muted:#65748B;--accent:#2563EB;--mint:#0E9F7E;--gold:#B7791F;--shadow:0 8px 24px rgba(19,32,54,.08);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;transition:background-color .35s ease,color .35s ease}
.wrap{max-width:460px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 110px)}
h1{font-size:24px;line-height:1.2;margin:0;font-weight:700;letter-spacing:-.01em}
h2{font-size:17px;font-weight:600;margin:22px 0 10px}
p{margin:0}
.muted,.label{color:var(--muted);font-size:13px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.badge{display:inline-block;font-size:11px;letter-spacing:.06em;color:var(--gold);border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);padding:2px 8px;border-radius:999px}
.seg{display:inline-flex;flex:none;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);min-height:36px;padding:0 12px;border-radius:999px;font:inherit;font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
button.card{font:inherit;font-weight:600;color:var(--text);text-align:left;cursor:pointer;min-height:96px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.num{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em;margin-top:4px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.row:first-child{padding-top:0}
.row:last-child{border-bottom:0;padding-bottom:0}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--accent),var(--mint));flex:none}
.pill{font-size:12px;padding:3px 10px;border-radius:999px;background:color-mix(in srgb,var(--mint) 18%,transparent);color:var(--mint);white-space:nowrap}
.pill.warn{background:color-mix(in srgb,var(--gold) 20%,transparent);color:var(--gold)}
.btn{min-height:44px;border:0;border-radius:14px;padding:0 16px;font:inherit;font-weight:600;background:var(--accent);color:#fff;cursor:pointer;display:grid;place-items:center;text-decoration:none;transition:transform .15s ease}
.btn:active,button.card:active,.chip:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1px var(--border)}
input,textarea,select{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:10px 12px;min-height:44px}
textarea{min-height:76px;resize:vertical}
.field{display:grid;gap:6px;margin-bottom:12px}
.hero-img{width:100%;height:170px;object-fit:cover;border-radius:18px;margin-bottom:16px;display:block}
.hero{height:170px;border-radius:18px;display:grid;place-items:center;text-align:center;padding:16px;color:var(--muted);font-size:13px;border:1px dashed var(--border);background:radial-gradient(120% 90% at 30% 0%,color-mix(in srgb,var(--accent) 30%,transparent),transparent 65%),var(--surface);margin-bottom:16px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:min(428px,calc(100% - 32px));display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:6px;box-shadow:var(--shadow);z-index:5}
.ind{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px) / 5);border-radius:18px;background:color-mix(in srgb,var(--accent) 16%,transparent);transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .2s}
.dock button{position:relative;z-index:1;background:none;border:0;color:var(--muted);font:inherit;font-size:11px;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:6px 0}
.dock button[aria-current="true"]{color:var(--accent);font-weight:600}
.dock svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 92px);transform:translate(-50%,12px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;white-space:nowrap;z-index:9}
.toast.on{opacity:1;transform:translate(-50%,0)}
.screen{animation:in .28s ease both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

settings:()=>head(t("settings"))+`<div class="card">
<div class="row"><span>${t("lang")}</span>${seg()}</div>
<div class="row"><span>${t("theme")}</span><div class="seg">${["system","light","dark"].map(m=>`<button data-tm="${m}" aria-pressed="${theme===m}">${t(m)}</button>`).join("")}</div></div>
<div class="row"><span>${t("tz")}</span><select style="width:auto"><option>Asia/Tashkent</option><option>UTC</option></select></div>
<div class="row"><span>${t("notif")}</span><input type="checkbox" checked style="width:20px;height:20px;min-height:0;accent-color:var(--accent)"></div>
</div>
<h2>${t("subs")}</h2><div class="card"><div style="color:var(--accent);word-break:break-all">https://t.me/Ieltswithmustaffa</div><p class="label" style="margin-top:8px">${t("subsNote")}</p></div>
<h2>${t("customBtns")}</h2><div class="card">
<div class="row"><div><div>${t("learnBtn")}</div><div class="label">${t("btnRoute")}</div></div><span class="pill">${t("btnPreview")}</span></div>
<div class="row"><div><div>${t("helpBtn")}</div><div class="label">${t("btnUrl")}</div></div><span class="pill">${t("btnPreview")}</span></div>
</div>`
};

function render(){
 document.documentElement.lang=L;
 document.title=`${t("appName")} · ${t(page)}`;
 app.innerHTML=`<div class="screen">${S[page]()}</div>`;
 paintDock();
 window.scrollTo(0,0);
}
function applyTheme(){document.documentElement.dataset.theme=theme==="system"?(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"):theme}
matchMedia("(prefers-color-scheme: light)").addEventListener("change",()=>{if(theme==="system")applyTheme()});
function toast(m){const x=$("#toast");x.textContent=m;x.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>x.classList.remove("on"),1800)}
function askAI(q){const a=$("#ans");a.innerHTML=`<div class="card"><div class="label"></div><p style="margin:8px 0">${t("ansBody")}</p><p class="label">${t("ansMeta")}</p><p class="label" style="margin-top:10px;color:var(--gold)">${t("aiNote")}</p></div>`;a.querySelector(".label").textContent=q}
function preview(){const v=$("#pv");v.hidden=false;v.innerHTML=`<div class="label">${t("preview")}</div><p id="p1" style="margin:8px 0 0"></p><p id="p2" class="muted" style="margin-top:6px"></p><button class="btn" style="margin-top:12px;width:100%">${t("btnTxt")}</button>`;$("#p1").textContent=$("#bEn").value;$("#p2").textContent=$("#bUz").value}

document.addEventListener("click",e=>{
 const el=e.target.closest("button,a");if(!el)return;const d=el.dataset;
 if(d.go){page=d.go;render();return}
 if(d.lang){L=d.lang;render();return}
 if(d.tm){theme=d.tm;applyTheme();render();return}
 if(d.range!=null){range=+d.range;render();return}
 if(d.q!=null){askAI(t("q"+d.q));return}
 if(d.act==="ask"){askAI($("#aiIn").value.trim()||t("q1"));return}
 if(d.act==="sub"){toast(t("demoToast"));return}
 if(d.act==="preview"){preview();return}
 if(d.act==="schedule"){toast(t("sent"));return}
});
document.addEventListener("input",e=>{if(e.target.id!=="srch")return;const v=e.target.value.toLowerCase();document.querySelectorAll(".prow").forEach(r=>r.style.display=r.textContent.toLowerCase().includes(v)?"":"none")});

applyTheme();
render();
</script>
</body>
</html>
